volumes:
  open-webui-data:
  grafana-data:

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: internal-llm-llama-cpp
    restart: unless-stopped
    gpus: "device=0"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command:
      - -m
      - /models/${LLAMA_MODEL_FILE}
      - --alias
      - ${LLAMA_MODEL_ALIAS}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "2"
      - --cont-batching
      - --metrics

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - llama-cpp
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP}"
      DEFAULT_USER_ROLE: "${DEFAULT_USER_ROLE}"
      WEBUI_ADMIN_EMAIL: "${WEBUI_ADMIN_EMAIL}"
      WEBUI_ADMIN_PASSWORD: "${WEBUI_ADMIN_PASSWORD}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      WEBUI_URL: "${WEBUI_URL}"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://llama-cpp:8080/v1"
      OPENAI_API_KEYS: "dummy-key"

  nginx:
    image: nginx:stable-alpine
    container_name: internal-llm-nginx
    restart: unless-stopped
    depends_on:
      - open-webui
      - grafana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro

  dns:
    image: coredns/coredns:latest
    container_name: internal-llm-dns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: internal-llm-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/blackbox.yml:/etc/prometheus/blackbox.yml:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: internal-llm-blackbox
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: internal-llm-nginx-exporter
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - "--nginx.scrape-uri=http://nginx:18080/stub_status"

  grafana:
    image: grafana/grafana:latest
    container_name: internal-llm-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://${GRAFANA_HOSTNAME}"
      GF_METRICS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
